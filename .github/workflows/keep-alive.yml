name: supabase-keep-alive

# Mantiene vivo el proyecto Supabase del free tier, que se pausa tras 7 dias
# sin actividad. Hace un SELECT minimo a gf_services (no toca datos) 3 veces
# por semana, lo que cuenta como actividad y resetea el contador de inactividad.
#
# La anon key es PUBLICA: va embebida en index.html (servida al browser) y los
# permisos reales los da RLS. Por eso esta hardcodeada aca y no como secret.

on:
  schedule:
    - cron: '0 12 * * 1,3,5'   # Lun / Mie / Vie 12:00 UTC = 09:00 ART
  workflow_dispatch: {}          # permite correrla a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST (SELECT chico = actividad)
        run: |
          SB_URL="https://ibikdnjuctopdkmtmgdd.supabase.co"
          SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliaWtkbmp1Y3RvcGRrbXRtZ2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MjEwOTMsImV4cCI6MjA5MTA5NzA5M30.Tzsi0ZbcdohuJLFTut4z8h2vf5yi1dv_KfA_6m6COBI"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SB_URL/rest/v1/gf_services?select=id&limit=1" \
            -H "apikey: $SB_ANON" \
            -H "Authorization: Bearer $SB_ANON")
          echo "Supabase REST respondio HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::keep-alive fallo — proyecto pausado/caido (HTTP $code). Restauralo en el dashboard de Supabase."
            exit 1
          fi
          echo "OK — proyecto activo, contador de inactividad reseteado."
