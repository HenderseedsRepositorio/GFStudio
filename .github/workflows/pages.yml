name: Campaña (GitHub Pages)

# Publica solo la carpeta campana-2027/ en GitHub Pages.
# El sitio de turnos sigue en Vercel: build.mjs no copia esta carpeta a dist/.
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "campana-2027/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy campaña
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: campana-2027
      - id: deployment
        uses: actions/deploy-pages@v4
